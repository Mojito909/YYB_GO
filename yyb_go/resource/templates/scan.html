<!DOCTYPE html>
<html lang="zh-CN" data-theme="system" data-theme-resolved="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fa">
  <title>扫码添加账号 · YYB Go</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/scan.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <main class="scan-page">
    <section class="scan-card panel" aria-label="扫码添加账号">
      <div class="scan-heading">
        <div class="eyebrow"><span class="eyebrow-dot"></span> 安全接入</div>
        <h2>扫码添加账号</h2>
        <p class="scan-sub">用手机微信扫描二维码，并在手机上确认登录</p>
      </div>

      <div class="qr-frame"><div class="qr-wrap" id="qrWrap"><span class="qr-placeholder">生成中…</span></div></div>

      <p class="scan-status pending" id="status" role="status">正在获取二维码…</p>
      <p class="scan-countdown" id="countdown"></p>

      <div class="scan-result hidden" id="accBox"></div>

      <div class="scan-actions">
        <button class="btn primary" id="refreshBtn" type="button"><span class="btn-icon" aria-hidden="true">↻</span> 重新生成二维码</button>
        <a class="btn secondary" href="/"><span class="btn-icon" aria-hidden="true">←</span> 返回控制台</a>
      </div>

      <a class="back-link" href="/">← 回到账号列表</a>
    </section>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/scan.js"></script>
</body>
</html>
